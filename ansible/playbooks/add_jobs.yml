- name: Add jobs using the add-top-packages endpoint
  hosts: all
  become: yes

  vars_prompt:
    - name: "platform"
      prompt: "Platform to request the packages"
      private: no
    - name: "amount"
      prompt: "Amount of packages to requests"
      private: no

  tasks:
    - name: Call add-top-packages endpoint
      community.docker.docker_compose_v2_exec:
        service: web
        command: "curl -X POST \"http://localhost:3000/api/crawler/add-top-packages\" -H \"Content-Type: application/json\" --data '{\"count\":{{ amount }},\"platform\":\"{{ platform}}\"}' -v"
        project_src: /datadisk/SecureSECO
      register: result
    - name: print output
      ansible.builtin.debug:
        var: result.stdout
